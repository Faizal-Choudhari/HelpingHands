{% extends "base.html" %}{% block title %}My Attendance{% endblock %}{% block content %}
<div class="container py-4"><span class="eyebrow">MY CONTRIBUTION</span><h2>My attendance history</h2><div class="panel mt-4"><div class="table-responsive"><table class="table"><thead><tr><th>Event</th><th>Date</th><th>Status</th><th>Hours</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.event_title }}</td><td>{{ r.event_date }}</td><td><span class="status {{ r.status }}">{{ r.status }}</span></td><td>{{ r.hours }}</td></tr>{% else %}<tr><td colspan="4">No attendance records yet.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
