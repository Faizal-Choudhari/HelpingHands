{% extends "base.html" %}{% block title %}{{ 'Edit' if event else 'Create' }} Event{% endblock %}{% block content %}
<div class="container py-5"><div class="form-shell"><span class="eyebrow">EVENT MANAGEMENT</span><h2>{{ 'Edit event' if event else 'Create a new event' }}</h2>
<form method="post" class="row g-3"><div class="col-12"><label class="form-label">Event title *</label><input class="form-control" name="title" required value="{{ event.title if event else '' }}"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" name="description">{{ event.description if event else '' }}</textarea></div>
<div class="col-md-6"><label class="form-label">Category</label><select class="form-select" name="category">{% for c in ['Education','Environment','Health','Community','Fundraising','Other'] %}<option {% if event and event.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Venue</label><input class="form-control" name="venue" value="{{ event.venue if event else '' }}"></div>
<div class="col-md-4"><label class="form-label">Event date *</label><input class="form-control" type="date" name="event_date" required value="{{ event.event_date if event else '' }}"></div><div class="col-md-4"><label class="form-label">Start time</label><input class="form-control" type="time" name="start_time" value="{{ event.start_time if event else '' }}"></div><div class="col-md-4"><label class="form-label">End time</label><input class="form-control" type="time" name="end_time" value="{{ event.end_time if event else '' }}"></div>
<div class="col-md-4"><label class="form-label">Volunteer capacity</label><input class="form-control" type="number" min="1" name="capacity" value="{{ event.capacity if event else 20 }}"></div><div class="col-md-4"><label class="form-label">Registration deadline</label><input class="form-control" type="date" name="registration_deadline" value="{{ event.registration_deadline if event else '' }}"></div><div class="col-md-4"><label class="form-label">Coordinator</label><select class="form-select" name="coordinator_id"><option value="">Not assigned</option>{% for c in coordinators %}<option value="{{ c.id }}" {% if event and event.coordinator_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Required skills</label><input class="form-control" name="required_skills" value="{{ event.required_skills if event else '' }}"></div><div class="col-12"><button class="btn btn-green">Save event</button><a href="{{ url_for('events') }}" class="btn btn-light ms-2">Cancel</a></div></form></div></div>{% endblock %}
