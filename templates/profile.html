{% extends "base.html" %}{% block title %}My Profile{% endblock %}{% block content %}
<div class="container py-5"><div class="form-shell"><span class="eyebrow">ACCOUNT SETTINGS</span><h2>My profile</h2><p class="text-muted">{{ user.email }} · {{ session.role|title }}</p>
<form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ user.name }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ user.phone or '' }}"></div>
{% if session.role=='volunteer' %}<div class="col-md-8"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ profile.address if profile else '' }}"></div><div class="col-md-4"><label class="form-label">Age</label><input class="form-control" type="number" name="age" value="{{ profile.age if profile and profile.age else '' }}"></div><div class="col-md-6"><label class="form-label">Skills</label><input class="form-control" name="skills" value="{{ profile.skills if profile else '' }}"></div><div class="col-md-6"><label class="form-label">Interests</label><input class="form-control" name="interests" value="{{ profile.interests if profile else '' }}"></div><div class="col-12"><label class="form-label">Availability</label><input class="form-control" name="availability" value="{{ profile.availability if profile else '' }}"></div>{% endif %}
<div class="col-12"><button class="btn btn-green">Save changes</button></div></form></div></div>{% endblock %}
